<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meltdown">
  <defs>
    <radialGradient id="coreHeat" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="26%" stop-color="#00f0ff"/>
      <stop offset="58%" stop-color="#ffaa00"/>
      <stop offset="82%" stop-color="#ff1133"/>
      <stop offset="100%" stop-color="#d000ff"/>
    </radialGradient>
    <linearGradient id="dieEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#d000ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0b1424"/>
      <stop offset="70%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)" stroke="#12203a" stroke-width="3"/>

  <!-- connector pins -->
  <g fill="#1b2c4a">
    <!-- top / bottom -->
    <g>
      <rect x="176" y="96" width="18" height="34" rx="4"/><rect x="212" y="96" width="18" height="34" rx="4"/>
      <rect x="248" y="96" width="18" height="34" rx="4"/><rect x="284" y="96" width="18" height="34" rx="4"/>
      <rect x="320" y="96" width="18" height="34" rx="4"/>
      <rect x="176" y="382" width="18" height="34" rx="4"/><rect x="212" y="382" width="18" height="34" rx="4"/>
      <rect x="248" y="382" width="18" height="34" rx="4"/><rect x="284" y="382" width="18" height="34" rx="4"/>
      <rect x="320" y="382" width="18" height="34" rx="4"/>
    </g>
    <!-- left / right -->
    <g>
      <rect x="96" y="176" width="34" height="18" rx="4"/><rect x="96" y="212" width="34" height="18" rx="4"/>
      <rect x="96" y="248" width="34" height="18" rx="4"/><rect x="96" y="284" width="34" height="18" rx="4"/>
      <rect x="96" y="320" width="34" height="18" rx="4"/>
      <rect x="382" y="176" width="34" height="18" rx="4"/><rect x="382" y="212" width="34" height="18" rx="4"/>
      <rect x="382" y="248" width="34" height="18" rx="4"/><rect x="382" y="284" width="34" height="18" rx="4"/>
      <rect x="382" y="320" width="34" height="18" rx="4"/>
    </g>
  </g>

  <!-- processor die -->
  <rect x="132" y="132" width="248" height="248" rx="40" fill="#070c16" stroke="url(#dieEdge)" stroke-width="6"/>
  <rect x="150" y="150" width="212" height="212" rx="28" fill="none" stroke="#12233d" stroke-width="2"/>

  <!-- molten core -->
  <circle cx="256" cy="248" r="92" fill="url(#coreHeat)" filter="url(#glow)" opacity="0.96"/>
  <circle cx="256" cy="248" r="92" fill="none" stroke="#eafcff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- overclock bolt -->
  <path d="M280 168 L206 262 H250 L232 344 L312 236 H264 Z"
        fill="#ffffff" stroke="#04060c" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
